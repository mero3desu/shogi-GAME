<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d5e"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </linearGradient>
    <linearGradient id="piece" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5e0"/>
      <stop offset="100%" stop-color="#e8c87a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <g filter="url(#shadow)" transform="translate(256, 256) scale(1.5) translate(-256, -256)">
    <polygon points="256,120 380,180 360,400 152,400 132,180" fill="url(#piece)" stroke="#8b6914" stroke-width="8"/>
    <text x="256" y="320" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="120" text-anchor="middle" fill="#1a1a2e">王</text>
  </g>
</svg>
